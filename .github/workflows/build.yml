name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Create debug keystore everywhere
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          cp debug.keystore app/debug.keystore || true
          mkdir -p Grudex-/app || true
          cp debug.keystore Grudex-/debug.keystore || true
          cp debug.keystore Grudex-/app/debug.keystore || true
          cp debug.keystore./app/build.gradle/../debug.keystore || true

      - run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Grudex-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
