name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        continue-on-error: true
      - run: npm run build
        continue-on-error: true
      - name: Build
        run: |
          if [ -f./gradlew ]; then chmod +x./gradlew &&./gradlew assembleDebug; else cd android && chmod +x./gradlew &&./gradlew assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Grudex-APK
          path: '**/build/outputs/apk/debug/*.apk'
